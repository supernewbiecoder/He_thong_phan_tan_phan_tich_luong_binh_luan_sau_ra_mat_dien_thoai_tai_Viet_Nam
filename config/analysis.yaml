# Phạm vi hiện theo bản đặc tả Q1–Q5; cần xác nhận với nhóm trước báo cáo chính thức.
target_model: s23u
predecessor_model: s22u
rival_models:
  - ip14prm
  - xiaomi13u

timezone: Asia/Ho_Chi_Minh
window_days: 28

# Chỉ dùng cho --demo và test (fixture ghi rule-v0, luôn đánh dấu data_kind=fixture).
# python -m src.run luôn truyền --model-version bằng MODEL_VERSION của bước suy luận (hiện rule-v1.1).
expected_model_version: rule-v0
# Contract v3 (như v2): clause_idx là vị trí mảng từ 0 trong comments.clauses.
clause_reference: position
clause_text_field: text
# Chỉ tạo cảnh báo, không loại mention có confidence thấp.
warning_confidence_threshold: 0.5
