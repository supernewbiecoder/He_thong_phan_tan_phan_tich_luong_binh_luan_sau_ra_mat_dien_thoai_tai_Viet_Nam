# Mục đích: Cấu hình các tham số vận hành, lưu trữ, chất lượng và quyền riêng tư của pipeline; cập nhật lần cuối: 2026-10-21.
timezone: Asia/Ho_Chi_Minh

quota:
  daily_limit: 10000      # hạn mức mặc định của YouTube Data API v3
  safety_ratio: 0.85      # chỉ dùng tối đa 85% để chừa dư địa
  search_daily_cap: 80    # search.list rất đắt (100 đơn vị/lần), chặn cứng số lần/ngày

discover:
  run_budget_units: 600

crawl:
  run_budget_units: 600          # ngân sách mỗi lần chạy job crawl
  min_poll_interval_min: 30      # video còn trong cửa sổ theo dõi: tối thiểu bao phút mới cào lại
  older_streak_stop: 3           # dừng phân trang khi gặp liên tiếp N comment cũ hơn mốc (chịu được comment ghim)

schedule:
  discover_cron_hour: 6          # giờ VN, chạy tìm video mới mỗi ngày
  crawl_every_min: 30

# Bố cục file dữ liệu trong data/raw:
#   single -> comments.jsonl và videos.jsonl: MỘT file cho mọi mẫu máy, mọi ngày (đang dùng)
#   daily  -> comments-YYYY-MM-DD.jsonl, ngày tính theo `timezone` ở trên
# Các mẫu khác nhau luôn phân biệt bằng trường `model`, ghi nối vào cuối file chứ KHÔNG ghi đè.
output:
  layout: single

# Cửa sổ dữ liệu theo đề tài: từ ngày ra mắt đến 4 tuần sau
window_weeks: 4
video_window_before_days: 7      # nhận cả video hands-on đăng trước ra mắt vài ngày

# === MẪU MÁY CHÍNH VÀ CÁC ĐỐI THỦ ===
# Mỗi mẫu chính có THỂ CÓ NHIỀU đối thủ (rivals). Sửa file khi `run` đang chạy: lần discover/crawl kế tiếp tự nhận.
#   name        nhãn ghi vào trường `model` (không dấu, không chứa '|')
#   title       (tùy chọn) tên hiển thị
#   aliases     cách gọi trong tiêu đề video (không phân biệt hoa/thường, dấu). Nên đủ cụ thể.
#   exclude     (tùy chọn) tiêu đề có cụm này thì KHÔNG tính cho mẫu đó
#   launch_date ngày ra mắt tại VN, YYYY-MM-DD. Rival bỏ trống thì dùng ngày của mẫu chính.
#   rivals      danh sách đối thủ; viết riêng tên (vd: - p9pro) để tham chiếu mẫu đã khai báo nơi khác
