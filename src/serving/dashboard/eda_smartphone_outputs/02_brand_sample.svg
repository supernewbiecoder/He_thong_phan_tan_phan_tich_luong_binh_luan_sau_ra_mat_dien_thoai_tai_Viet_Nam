   <text style="font-weight: 700; font-size: 16px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #0f2942" x="19.33" y="21.2025" transform="rotate(-0 19.33 21.2025)">Apple và Samsung chiếm phần lớn thảo luận, nhưng mật độ bình luận/video khác nhau</text>
  </g>
  <g id="text_44">
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #64748b" x="19.33" y="39.456" transform="rotate(-0 19.33 39.456)">Trái: % bình luận đủ điều kiện theo hãng ngữ cảnh · Phải: bình luận trung bình mỗi video</text>
  </g>
  <g id="text_45">
   <text style="font-size: 8.5px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #64748b" x="19.33" y="400.331859" transform="rotate(-0 19.33 400.331859)">Hãng suy từ mã model của video bằng BRAND_REGISTRY. "Đa hãng" = video so sánh nhiều hãng (mã có dấu |); không nhân đôi bình luận sang từng hãng.</text>
