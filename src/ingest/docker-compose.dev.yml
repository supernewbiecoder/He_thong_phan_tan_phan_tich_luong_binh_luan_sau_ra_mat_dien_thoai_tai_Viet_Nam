# Mục đích: Dựng Kafka 1 node và MongoDB 7.0 trên máy để thử phần streaming (tùy chọn, docs/spec/pipeline.md) và cơ sở dữ liệu (Công việc 3); cập nhật lần cuối: 2026-11-16.
# Kafka 1 node (KRaft) chỉ để dev crawler/replay trên máy bạn.
# Cụm 3 broker + Spark do bạn phụ trách "Kafka và Spark" dựng riêng.
services:
  kafka:
    image: apache/kafka:3.8.0
    container_name: kafka-dev
    ports: ["9092:9092"]
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_OFFSET_TOPICS_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_NUM_PARTITIONS: 3
    networks:
      - sentiment-net

  mongodb:
    image: mongo:7.0
    container_name: mongodb-dev
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: smartphone_analytics
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - sentiment-net

volumes:
  mongo_data:
    name: mongo_data_sentiment

networks:
  sentiment-net:
    name: sentiment-net
    driver: bridge
